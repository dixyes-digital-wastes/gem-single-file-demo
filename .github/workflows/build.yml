name: build

on:
  push:
    branches: [latest]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    name: Linux x86_64
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Check out lwmbs
        uses: actions/checkout@v4
        with:
          repository: dixyes/lwmbs
          ref: 49e825a087d60b544724ee9afd5733a5718da4c1
          path: lwmbs

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential autoconf automake bison cmake flex libtool \
            re2c patch pkg-config libffi-dev zlib1g-dev

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          coverage: none

      - name: Build static dependencies
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p build
          cd build
          php ../lwmbs/fetch_source.php \
            "zlib,openssl,nghttp2,libssh2,curl,libffi" "" \
            --phpVer=8.4 --versionFile=./versionFile
          php ../lwmbs/build_libs.php \
            "zlib,openssl,nghttp2,libssh2,curl,libffi" \
            --arch=x86_64 --noSystem --fresh

      - name: Build micro.sfx
        env:
          SWOW_SSL: '1'
          SWOW_CURL: '1'
        run: |
          export PKG_CONFIG_PATH="$PWD/build/lib/pkgconfig"
          export CFLAGS="-I$PWD/build/include"
          export LDFLAGS="-L$PWD/build/lib"
          export EXTRA_LIBS="-Wl,--start-group $(find "$PWD/build/lib" -name '*.a' -print | tr '\n' ' ') -Wl,--end-group -ldl -lpthread -lresolv"
          export STATIC_LIBS_TAIL="-L$PWD/build/lib -lnghttp2 -lssh2 -lcrypto -lssl"
          ./build-micro.sh

      - name: Build the phar
        run: php -d phar.readonly=0 build-phar.php

      - name: Build the demo binary
        run: ./build-demo.sh

      - name: Smoke test
        run: |
          ./gem-demo-linux-x86_64 version
          ./gem-demo-linux-x86_64 gemm 256 2
          ./gem-demo-linux-x86_64 gemv q8_0 64 128 2

      - uses: actions/upload-artifact@v4
        with:
          name: gem-demo-linux-x86_64
          path: gem-demo-linux-x86_64
          if-no-files-found: error

  macos:
    name: macOS
    runs-on: macos-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Check out lwmbs
        uses: actions/checkout@v4
        with:
          repository: dixyes/lwmbs
          ref: 49e825a087d60b544724ee9afd5733a5718da4c1
          path: lwmbs

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          coverage: none

      - name: Install build dependencies
        run: |
          brew install autoconf automake bison cmake flex re2c pkg-config
          echo "$(brew --prefix bison)/bin" >> "$GITHUB_PATH"

      - name: Build static dependencies
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p build
          cd build
          php ../lwmbs/fetch_source.php \
            "zlib,openssl,nghttp2,libssh2,curl,libffi" "" \
            --phpVer=8.4 --versionFile=./versionFile
          php ../lwmbs/build_libs.php \
            "zlib,openssl,nghttp2,libssh2,curl,libffi" \
            --arch="$(uname -m)" --fresh

      - name: Build micro.sfx
        env:
          CC: clang
          SWOW_SSL: '1'
          SWOW_CURL: '1'
        run: |
          export PKG_CONFIG_PATH="$PWD/build/lib/pkgconfig"
          export CFLAGS="-I$PWD/build/include"
          export LDFLAGS="-L$PWD/build/lib"
          export EXTRA_LIBS="-Wl,-all_load $(find "$PWD/build/lib" -name '*.a' -print | tr '\n' ' ') -lresolv"
          export STATIC_LIBS_TAIL="-L$PWD/build/lib -lnghttp2 -lssh2 -lcrypto -lssl -framework CoreFoundation -framework SystemConfiguration"
          ./build-micro.sh

      - name: Build the phar
        run: php -d phar.readonly=0 build-phar.php

      - name: Build the demo binary
        env:
          TARGET: gem-demo-macos
        run: ./build-demo.sh

      - name: Smoke test
        run: |
          ./gem-demo-macos version
          ./gem-demo-macos gemm 256 2
          ./gem-demo-macos gemv q8_0 64 128 2

      - uses: actions/upload-artifact@v4
        with:
          name: gem-demo-macos
          path: gem-demo-macos
          if-no-files-found: error

  windows:
    name: Windows x86_64
    runs-on: windows-2022
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Check out the PHP build tools
        uses: actions/checkout@v4
        with:
          repository: php/php-sdk-binary-tools
          ref: master
          path: php-sdk-binary-tools

      - name: Check out lwmbs
        uses: actions/checkout@v4
        with:
          repository: dixyes/lwmbs
          ref: 49e825a087d60b544724ee9afd5733a5718da4c1
          path: lwmbs

      - name: Prepare sources
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $build = Join-Path $PWD 'build'
          New-Item -ItemType Directory -Force $build | Out-Null
          Copy-Item 'third_party/php-src' (Join-Path $build 'php-src') -Recurse
          Remove-Item (Join-Path $build 'php-src/.git') -Recurse -Force -ErrorAction SilentlyContinue
          Copy-Item 'third_party/micro' (Join-Path $build 'php-src/sapi/micro') -Recurse
          Remove-Item (Join-Path $build 'php-src/sapi/micro/.git') -Recurse -Force -ErrorAction SilentlyContinue
          Copy-Item 'third_party/swow/ext' (Join-Path $build 'php-src/ext/swow') -Recurse
          Remove-Item (Join-Path $build 'php-src/ext/swow/.git') -Recurse -Force -ErrorAction SilentlyContinue
          Push-Location (Join-Path $build 'php-src')
          patch -p1 -i (Join-Path $PWD '..\..\patches\php-jit-24635.patch')
          foreach ($patch in 'cli_checks_87', 'vcruntime140_84', 'win32_85', 'zend_stream', 'phar_86', 'static_extensions_win32_86') {
            $path = "sapi/micro/patches/$patch.patch"
            if (Test-Path $path) {
              Get-Content $path | patch -p1
            }
          }
          # PHP 8.7 normally requires VS18; this branch keeps VS17 alive until
          # lwmbs can build the final VS18 toolchain.
          $confutils = Join-Path $PWD 'win32/build/confutils.js'
          (Get-Content $confutils) -replace 'version < 1950', 'version < 1930' | Set-Content $confutils
          Pop-Location

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          coverage: none

      - name: Build static dependencies
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force build | Out-Null
          Set-Location build
          php ..\lwmbs\fetch_source.php "zlib,openssl,nghttp2,libssh2,curl,libffi" "" --phpVer=8.4 --versionFile=./versionFile
          php ..\lwmbs\build_libs.php "zlib,openssl,nghttp2,libssh2,curl,libffi" --phpBinarySDKDir="${{ github.workspace }}\php-sdk-binary-tools" --vsVer=17 --arch=x64 --fresh

      - name: Build micro.sfx
        shell: ..\..\php-sdk-binary-tools\phpsdk-starter.bat -c vs17 -a x64 -t {0}
        working-directory: build/php-src
        run: |
          buildconf.bat
          configure.bat --disable-all --enable-micro=yes --enable-zts --disable-cgi --disable-cli --disable-phpdbg --enable-phar --with-ffi --with-php-build=..\deps --enable-swow --enable-swow-curl --enable-swow-ssl --disable-swow-pdo-pgsql
          nmake micro LIBS_MICRO="libssl.lib libcrypto.lib libcurl.lib libssh2.lib nghttp2.lib zlibstatic.lib libffi.lib crypt32.lib wldap32.lib ws2_32.lib shell32.lib"

      - name: Build the phar
        run: php -d phar.readonly=0 build-phar.php

      - name: Build the demo binary
        shell: pwsh
        run: ./build-demo.ps1 -Sfx build/php-src/x64/Release_TS/micro.sfx -Phar build/gem.phar -Target gem-demo-windows-x86_64.exe

      - name: Smoke test
        shell: pwsh
        run: |
          ./gem-demo-windows-x86_64.exe version
          ./gem-demo-windows-x86_64.exe gemm 256 2
          ./gem-demo-windows-x86_64.exe gemv q8_0 64 128 2

      - uses: actions/upload-artifact@v4
        with:
          name: gem-demo-windows-x86_64
          path: gem-demo-windows-x86_64.exe
          if-no-files-found: error
